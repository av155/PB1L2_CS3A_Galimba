<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post It</title>
    <link rel="stylesheet" href="postit.css">

    <!-- Cloudflare Crypto 4.2.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>

    <!-- Main container -->
    <div class="container">

        <h1>POST IT</h1>
        <p class="subtitle">Secure Caption Posting</p>

        <!-- User information section -->
        <div id="userSection">
            <label for="userName">Enter your name:</label>
            <input type="text" id="userName" placeholder="Your Full Name">
            <button onclick="setUser()">Continue</button>
        </div>

        <!-- Posting section -->
        <div id="postSection" class="hidden">

            <h2>Welcome, <span id="displayName"></span>!</h2>

            <textarea id="caption" placeholder="Write your caption here..."></textarea>

            <button onclick="addPost()">POST</button>

            <!-- Thread of posts -->
            <div id="postThread"></div>

        </div>

    </div>

    <script src="postit.js"></script>
</body>
</html>
